name: Credential Backend Matrix

on:
  pull_request:
    paths:
      - 'v3/@hive-flow/cli/src/credential-store/**'
      - '.github/workflows/credential-backends.yml'
  push:
    branches:
      - main
      - phase7-step0-provider-packaging
    paths:
      - 'v3/@hive-flow/cli/src/credential-store/**'
      - '.github/workflows/credential-backends.yml'

jobs:
  credential-backends:
    name: credential backends (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux Secret Service tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools dbus-x11

      - name: Build Windows credential helper
        if: runner.os == 'Windows'
        run: dotnet build v3/@hive-flow/cli/src/credential-store/helpers/windows-credential-helper/HiveFlow.WindowsCredentialHelper.csproj -c Release

      - name: Build Windows peer-credential helper
        if: runner.os == 'Windows'
        run: dotnet build v3/@hive-flow/cli/src/credential-store/helpers/windows-peer-cred-helper/HiveFlow.WindowsPeerCredHelper.csproj -c Release

      - name: Run macOS native Keychain backend test
        if: runner.os == 'macOS'
        run: pnpm --dir v3 --filter @hive-flow/cli exec vitest run src/credential-store/__tests__/platform-backends.test.ts src/credential-store/__tests__/peer-credentials.test.ts src/credential-store/__tests__/holder.test.ts src/credential-store/__tests__/boundary-gates.test.ts

      - name: Run Linux native Secret Service backend test
        if: runner.os == 'Linux'
        env:
          HIVE_FLOW_RUN_NATIVE_LINUX_CREDENTIAL_TESTS: '1'
          HIVE_FLOW_RUN_NATIVE_LINUX_PEER_CRED_TESTS: '1'
        run: dbus-run-session -- pnpm --dir v3 --filter @hive-flow/cli exec vitest run src/credential-store/__tests__/platform-backends.test.ts src/credential-store/__tests__/peer-credentials.test.ts src/credential-store/__tests__/holder.test.ts src/credential-store/__tests__/boundary-gates.test.ts

      - name: Run Windows native Credential Manager backend test
        if: runner.os == 'Windows'
        env:
          HIVE_FLOW_RUN_NATIVE_WINDOWS_CREDENTIAL_TESTS: '1'
          HIVE_FLOW_RUN_NATIVE_WINDOWS_PEER_CRED_TESTS: '1'
          HIVE_FLOW_WINDOWS_CREDENTIAL_HELPER: ${{ github.workspace }}\v3\@hive-flow\cli\src\credential-store\helpers\windows-credential-helper\bin\Release\net8.0-windows10.0.19041.0\HiveFlow.WindowsCredentialHelper.exe
          HIVE_FLOW_WINDOWS_PEER_CRED_HELPER: ${{ github.workspace }}\v3\@hive-flow\cli\src\credential-store\helpers\windows-peer-cred-helper\bin\Release\net8.0-windows10.0.19041.0\HiveFlow.WindowsPeerCredHelper.exe
        run: pnpm --dir v3 --filter @hive-flow/cli exec vitest run src/credential-store/__tests__/platform-backends.test.ts src/credential-store/__tests__/peer-credentials.test.ts src/credential-store/__tests__/holder.test.ts src/credential-store/__tests__/boundary-gates.test.ts
