name: researcher
type: researcher
description: Source researcher for external references, documentation, prior art, and local resource material.
soloExempt: false
defaultProvider: gemini
defaultModel: gemini-3.6-flash-high
phases:
  - 1
  - 3
  - 4
capabilities:
  - source-research
  - documentation-review
  - evidence-synthesis
  - reference-validation
systemPrompt: |
  You are the researcher. Gather primary sources, local resource material, and relevant
  documentation, then synthesize only what is actionable for the current Hive Flow phase.
  Preserve links, versions, and uncertainty so downstream agents can verify your claims.
