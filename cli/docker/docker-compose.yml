# Hive Flow v3.5 — Docker Compose Profiles
#
# Profiles:
#   lite     — MCP server only (stdio), minimal footprint
#   full     — CLI + daemon + all optional deps
#   workers  — Scalable worker pool (extends docker-compose.workers.yml)
#
# Usage:
#   docker compose -f cli/docker/docker-compose.yml --profile lite up
#   docker compose -f cli/docker/docker-compose.yml --profile full up -d
#   docker compose -f cli/docker/docker-compose.yml --profile workers up -d --scale worker=5
#
# Environment (required for full/workers):
#   ANTHROPIC_API_KEY — Your Anthropic API key

services:
  # ── lite: MCP server on stdio (~80MB) ──────────────────────────
  mcp:
    profiles: ["lite"]
    build:
      context: ../../../..
      dockerfile: cli/docker/Dockerfile
    image: hive-flow:lite
    stdin_open: true
    environment:
      - NODE_ENV=production
      - HIVE_FLOW_MCP_TRANSPORT=stdio
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "hive-flow", "doctor", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── full: CLI + daemon + optional deps (~800MB) ────────────────
  hive-flow-full:
    profiles: ["full"]
    build:
      context: ../../../..
      dockerfile: cli/docker/Dockerfile.full
    image: hive-flow:full
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NODE_ENV=production
      - HIVE_FLOW_LOG_LEVEL=${HIVE_FLOW_LOG_LEVEL:-info}
      - HIVE_FLOW_MEMORY_BACKEND=hybrid
    volumes:
      - hive-flow-state:/home/hive-flow/.hive-flow
      - hive-flow-logs:/var/log/hive-flow
    ports:
      - "${HIVE_FLOW_MCP_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "1"
          memory: 2G
    command: ["hive-flow", "daemon", "start", "--foreground"]
    healthcheck:
      test: ["CMD", "hive-flow", "doctor", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── workers: Scalable worker pool ──────────────────────────────
  worker:
    profiles: ["workers"]
    build:
      context: ../../../..
      dockerfile: cli/docker/Dockerfile
    image: hive-flow:lite
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_CODE_HEADLESS=true
      - CLAUDE_CODE_SANDBOX_MODE=${HIVE_FLOW_SANDBOX:-strict}
      - HIVE_FLOW_WORKERS=${HIVE_FLOW_WORKERS:-audit,optimize,testgaps}
      - NODE_ENV=production
    volumes:
      - worker-state:/home/hive-flow/.hive-flow
      - worker-logs:/var/log/hive-flow
    deploy:
      replicas: ${HIVE_FLOW_WORKER_REPLICAS:-3}
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    command: ["hive-flow", "daemon", "start", "--foreground", "--headless"]
    healthcheck:
      test: ["CMD", "hive-flow", "doctor", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  hive-flow-state:
  hive-flow-logs:
  worker-state:
  worker-logs:
